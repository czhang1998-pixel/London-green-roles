<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>London green jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#F5F7F3; --surface:#FFFFFF; --ink:#1D2A23; --muted:#5A6A61; --rule:#D6DED7;
  --focus:#2F6B3E; --chip:#E8EEE8;
  --c0:#D9822B; --c1:#8A68B8; --c2:#4C9A52; --c3:#C25E57; --c4:#C9A42C; --c5:#3D8BB4; --c6:#8A958F;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B17; --surface:#1B241F; --ink:#E6ECE7; --muted:#9FB0A6; --rule:#2C3831;
    --focus:#8CCB97; --chip:#24302A;
  }
}
:root[data-theme="dark"]{
  --paper:#141B17; --surface:#1B241F; --ink:#E6ECE7; --muted:#9FB0A6; --rule:#2C3831;
  --focus:#8CCB97; --chip:#24302A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:46rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1{font:700 clamp(2.1rem,7vw,3.3rem)/1.05 var(--serif);letter-spacing:-.015em;margin:0 0 .6rem}
.lede{color:var(--muted);margin:0 0 2rem;font-size:1.05rem}
.lede strong{color:var(--ink);font-weight:600}

.controls{display:grid;gap:.9rem;margin-bottom:2rem}
.search{width:100%;font:inherit;padding:.75rem .9rem;border:1px solid var(--rule);border-radius:.5rem;background:var(--surface);color:var(--ink)}
.search::placeholder{color:var(--muted)}
.period{display:inline-flex;border:1px solid var(--rule);border-radius:.5rem;overflow:hidden;justify-self:start}
.period button{font:500 .9rem var(--sans);padding:.5rem .95rem;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.period button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{font:500 .85rem var(--sans);display:inline-flex;align-items:center;gap:.45rem;padding:.4rem .75rem;border-radius:999px;border:1px solid transparent;background:var(--chip);color:var(--ink);cursor:pointer}
.chip .dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--c)}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.chip:disabled{opacity:.45;cursor:default}
button:focus-visible,.search:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.week{margin:2.2rem 0 .6rem;font:500 1.15rem var(--serif);color:var(--muted)}
.week:first-child{margin-top:0}
ul.jobs{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.job{position:relative;padding:1rem 0 1rem 1.1rem;border-bottom:1px solid var(--rule)}
.job::before{content:"";position:absolute;left:0;top:1.05rem;bottom:1.05rem;width:4px;border-radius:2px;background:var(--c)}
.job h3{margin:0 0 .2rem;font:600 1.05rem/1.35 var(--sans)}
.job h3 a{color:var(--ink);text-decoration:none}
.job h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.who{margin:0;color:var(--ink)}
.facts{margin:.15rem 0 0;color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:.2rem 1rem}
.tags{margin:.5rem 0 0;display:flex;flex-wrap:wrap;gap:.35rem}
.tag{font-size:.78rem;padding:.12rem .5rem;border-radius:.3rem;background:var(--chip);color:var(--muted)}
.empty{padding:2rem 0;color:var(--muted)}
.empty button{font:inherit;color:var(--focus);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
footer{margin-top:3rem;color:var(--muted);font-size:.85rem}
footer ul{padding-left:1.1rem;margin:.4rem 0 0}
@media (max-width:30rem){.wrap{padding-top:1.75rem}}
</style>
</head>
<body>
<main class="wrap">
  <h1>London green jobs</h1>
  <p class="lede" id="lede"></p>

  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search titles and employers" aria-label="Search titles and employers">
    <div class="period" role="group" aria-label="Time period">
      <button data-p="week" aria-pressed="true">New this week</button>
      <button data-p="all" aria-pressed="false">Last 90 days</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by employer type"></div>
  </div>

  <div id="list" aria-live="polite"></div>
  <footer id="foot"></footer>
</main>

<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const cats = D.categories;
  const colour = c => `var(--c${Math.max(0, Math.min(cats.indexOf(c), 6))})`;
  const fmt = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? '' :
    d.toLocaleDateString('en-GB', {day:'numeric', month:'long'}); };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const weekStart = (() => { const d = new Date(D.updated + 'T00:00:00'); d.setDate(d.getDate() - 6); return d.toISOString().slice(0,10); })();

  let state = {period:'week', cat:'All', q:''};

  document.getElementById('lede').innerHTML =
    `Updated ${fmt(D.updated)}. <strong>${D.new_count} new</strong> ${D.new_count === 1 ? 'job' : 'jobs'} this week across councils, universities, parks and developers.`;

  function base(){
    const q = state.q.trim().toLowerCase();
    return D.jobs.filter(j => (state.period === 'all' || j.first_seen >= weekStart) &&
      (!q || `${j.title} ${j.employer} ${(j.keywords||[]).join(' ')}`.toLowerCase().includes(q)));
  }

  function renderChips(rows){
    const counts = {}; rows.forEach(j => counts[j.category] = (counts[j.category]||0) + 1);
    const all = [`<button class="chip" data-c="All" aria-pressed="${state.cat==='All'}" style="--c:var(--ink)"><span class="dot"></span>All <span class="n">${rows.length}</span></button>`];
    cats.forEach(c => {
      const n = counts[c] || 0;
      all.push(`<button class="chip" data-c="${esc(c)}" aria-pressed="${state.cat===c}" style="--c:${colour(c)}" ${n||state.cat===c?'':'disabled'}><span class="dot"></span>${esc(c)} <span class="n">${n}</span></button>`);
    });
    document.getElementById('chips').innerHTML = all.join('');
  }

  function render(){
    const rows = base();
    renderChips(rows);
    const shown = rows.filter(j => state.cat === 'All' || j.category === state.cat)
      .sort((a,b) => (b.first_seen.localeCompare(a.first_seen)) || (b.posted||'').localeCompare(a.posted||''));
    const list = document.getElementById('list');
    if (!shown.length){
      list.innerHTML = D.jobs.length
        ? `<p class="empty">No jobs match these filters. <button id="reset">Show all jobs from the last 90 days</button></p>`
        : `<p class="empty">No jobs yet. The list fills in after the bot's first weekly run.</p>`;
      const r = document.getElementById('reset');
      if (r) r.onclick = () => { state = {period:'all', cat:'All', q:''}; document.getElementById('q').value=''; syncPeriod(); render(); };
      return;
    }
    let html = '', current = null;
    shown.forEach(j => {
      if (j.first_seen !== current){
        if (current !== null) html += '</ul>';
        current = j.first_seen;
        html += `<h2 class="week">Found ${fmt(current)}</h2><ul class="jobs">`;
      }
      const facts = [j.location, j.salary, j.posted ? `Posted ${fmt(j.posted)}` : ''].filter(Boolean).map(f => `<span>${esc(f)}</span>`).join('');
      html += `<li class="job" style="--c:${colour(j.category)}">
        <h3><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h3>
        <p class="who">${esc(j.employer)}</p>
        <p class="facts">${facts}</p>
        <p class="tags">${(j.keywords||[]).map(k => `<span class="tag">${esc(k)}</span>`).join('')}<span class="tag">${esc(j.source)}</span></p>
      </li>`;
    });
    list.innerHTML = html + '</ul>';
  }

  function syncPeriod(){
    document.querySelectorAll('.period button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === state.period));
  }

  document.querySelector('.period').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.period = b.dataset.p; syncPeriod(); render();
  });
  document.getElementById('chips').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    state.cat = b.dataset.c; render();
  });
  document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });

  if (D.errors && D.errors.length){
    document.getElementById('foot').innerHTML =
      `Couldn't check these sources this week. If a careers page moved, update its link in config.yaml.<ul>${D.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`;
  }
  if (!D.jobs.some(j => j.first_seen >= weekStart) && D.jobs.length){ state.period = 'all'; syncPeriod(); }
  render();
})();
</script>
</body>
</html>
